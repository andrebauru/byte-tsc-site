<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Quake Byte TSC">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#dde3ec"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12386e"/>
      <stop offset="1" stop-color="#0c2549"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe5ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8912d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8912d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- room -->
  <rect width="1200" height="760" fill="url(#wall)"/>
  <rect y="560" width="1200" height="200" fill="#cfd6e0"/>
  <rect y="552" width="1200" height="10" fill="#b9c2d0"/>

  <!-- window hint -->
  <rect x="70" y="90" width="240" height="330" rx="12" fill="#c3d3e8"/>
  <line x1="190" y1="90" x2="190" y2="420" stroke="#aab8cc" stroke-width="10"/>
  <line x1="70" y1="255" x2="310" y2="255" stroke="#aab8cc" stroke-width="10"/>
  <circle cx="250" cy="160" r="38" fill="#e8912d" opacity="0.35"/>

  <!-- plant -->
  <path d="M 1010 560 q -12 -70 14 -108 q 30 40 14 108 z" fill="#4b7a5a"/>
  <path d="M 1036 560 q 16 -92 -12 -132 q -34 48 -12 132 z" fill="#3d6a4c"/>
  <rect x="988" y="552" width="66" height="26" rx="8" fill="#8a6a4a"/>

  <!-- low shelf -->
  <rect x="770" y="430" width="330" height="16" rx="8" fill="#a58062"/>
  <rect x="790" y="446" width="16" height="120" fill="#8f6d50"/>
  <rect x="1064" y="446" width="16" height="120" fill="#8f6d50"/>

  <!-- Quake Byte TSC device (concept) -->
  <g>
    <rect x="820" y="236" width="180" height="196" rx="22" fill="url(#device)"/>
    <rect x="836" y="252" width="148" height="86" rx="10" fill="url(#screen)"/>
    <circle cx="856" cy="370" r="9" fill="#e8912d"/>
    <circle cx="886" cy="370" r="9" fill="#b8c4d6"/>
    <circle cx="916" cy="370" r="9" fill="#b8c4d6"/>
    <circle cx="946" cy="370" r="9" fill="#b8c4d6"/>
    <rect x="856" y="398" width="108" height="8" rx="4" fill="#b8c4d6"/>
    <!-- screen content: abstract waveform, no text -->
    <g fill="#e8f0f8" opacity="0.92">
      <rect x="850" y="284" width="6" height="12" rx="3"/>
      <rect x="861" y="274" width="6" height="22" rx="3"/>
      <rect x="872" y="290" width="6" height="20" rx="3"/>
      <rect x="883" y="282" width="6" height="28" rx="3"/>
      <rect x="894" y="268" width="6" height="42" rx="3"/>
      <rect x="905" y="290" width="6" height="20" rx="3"/>
      <rect x="916" y="278" width="6" height="32" rx="3"/>
      <rect x="927" y="284" width="6" height="12" rx="3"/>
      <rect x="938" y="274" width="6" height="22" rx="3"/>
      <rect x="949" y="288" width="6" height="18" rx="3"/>
      <rect x="960" y="283" width="6" height="24" rx="3"/>
      <rect x="971" y="289" width="6" height="18" rx="3"/>
    </g>
    <rect x="850" y="316" width="134" height="6" rx="3" fill="#e8912d"/>
    <!-- status LED -->
    <circle cx="910" cy="228" r="7" fill="#e8912d"/>
    <circle cx="910" cy="228" r="26" fill="url(#glow)"/>
  </g>

  <!-- incoming data / broadcast waves -->
  <g fill="none" stroke="#10305c">
    <path d="M 910 158 a 70 70 0 0 0 -70 70" stroke-width="7" opacity="0.75"/>
    <path d="M 910 128 a 100 100 0 0 0 -100 100" stroke-width="6" opacity="0.5"/>
    <path d="M 910 98 a 130 130 0 0 0 -130 130" stroke-width="5" opacity="0.3"/>
  </g>
  <circle cx="700" cy="384" r="14" fill="#10305c"/>
  <circle cx="700" cy="384" r="30" fill="none" stroke="#10305c" stroke-width="5" opacity="0.4"/>

  <!-- baseline -->
  <rect y="752" width="1200" height="8" fill="#10305c"/>
</svg>